<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quest Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Quest Log</h1>
  <div id="tab-bar">
    <button id="tab-quests" class="tab active" type="button">Quests</button>
    <button id="tab-daily" class="tab" type="button">Daily</button>
    <button id="tab-journal" class="tab" type="button">Journal</button>
    <button id="tab-completed" class="tab" type="button">Completed</button>
  </div>
  <div id="panel-quests">
    <div id="app"></div>
  </div>
  <div id="panel-daily" hidden>
    <div id="daily-panel">
      <h2 id="daily-date">Daily</h2>
      <div id="daily-add-row">
        <input type="text" id="daily-input" placeholder="New task...">
        <button id="daily-add" type="button">Add</button>
      </div>
      <ul id="daily-list"></ul>
    </div>
  </div>
  <div id="panel-journal" hidden>
    <div id="journal-panel">
      <h2>Journal</h2>
      <textarea id="journal-text" rows="8" placeholder="Write today's entry..."></textarea>
      <button id="journal-save" type="button">Save</button>
      <h3>Past entries</h3>
      <ul id="journal-list"></ul>
    </div>
  </div>
  <div id="panel-completed" hidden>
    <div id="completed-panel">
      <h2>Completed</h2>
      <ul id="completed-list"></ul>
    </div>
  </div>
<div id="settings-placeholder"></div>



  <script type="module" src="app.js"></script>
</body>
</html>
